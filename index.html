<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Ulangkaji Interaktif - Pedagogi AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .option-btn { transition: all 0.2s ease-in-out; }
        .option-btn:hover:not(:disabled) { transform: translateY(-2px); }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 min-h-screen text-slate-800 flex items-center justify-center p-4">

    <!-- Screen 1: Login / Welcome -->
    <div id="login-screen" class="glass-panel w-full max-w-lg rounded-3xl p-8 md:p-10 fade-in text-center">
        <div class="mb-6 flex justify-center">
            <div class="bg-indigo-100 p-4 rounded-full">
                <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
            </div>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">Sistem Ulangkaji Interaktif</h1>
        <p class="text-slate-500 mb-8 text-sm md:text-base">Modul Tajuk 1: Reka Bentuk Pedagogi & Pembelajaran Aktif Berasaskan Gemini AI</p>
        
        <div class="space-y-4 text-left">
            <label for="student-name" class="block text-sm font-semibold text-slate-700">Nama Peserta / Pensyarah:</label>
            <input type="text" id="student-name" placeholder="Sila masukkan nama anda..." class="w-full px-5 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition shadow-sm">
            <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-200 transform hover:scale-[1.02]">Mula Ulangkaji</button>
        </div>
        <p id="name-error" class="text-red-500 text-sm mt-3 hidden">Sila masukkan nama anda terlebih dahulu.</p>
    </div>

    <!-- Screen 2: Quiz -->
    <div id="quiz-screen" class="glass-panel w-full max-w-3xl rounded-3xl p-6 md:p-8 hidden fade-in flex flex-col h-[90vh] md:h-auto overflow-y-auto">
        
        <!-- Header: Info & Progress -->
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
            <div>
                <p class="text-sm text-slate-500 font-medium">Peserta: <span id="display-name" class="font-bold text-indigo-700"></span></p>
                <p class="text-xs text-slate-400 mt-1">Modul PdP Cakna Digital AI</p>
            </div>
            <div class="text-right">
                <div class="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-lg font-bold text-sm">
                    Soalan <span id="current-q-num">1</span> / 30
                </div>
            </div>
        </div>

        <div class="w-full bg-slate-200 rounded-full h-2.5 mb-6">
            <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Question Area -->
        <div class="flex-grow">
            <h2 id="question-text" class="text-lg md:text-xl font-semibold text-slate-800 mb-6 leading-relaxed">
                <!-- Question will appear here -->
            </h2>

            <div id="options-container" class="space-y-3 mb-6">
                <!-- Options will be injected here -->
            </div>

            <!-- Feedback Area -->
            <div id="feedback-container" class="hidden rounded-xl p-5 mb-6 border fade-in">
                <div class="flex items-start">
                    <div id="feedback-icon" class="flex-shrink-0 mt-0.5 mr-3"></div>
                    <div>
                        <h3 id="feedback-title" class="font-bold text-lg mb-1"></h3>
                        <p id="feedback-justification" class="text-sm md:text-base leading-relaxed"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Next Button -->
        <div class="mt-auto pt-4 flex justify-end">
            <button id="next-btn" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-8 rounded-xl shadow-md transition duration-200">Seterusnya</button>
            <button id="finish-btn" class="hidden bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-8 rounded-xl shadow-md transition duration-200">Lihat Keputusan</button>
        </div>
    </div>

    <!-- Screen 3: Result -->
    <div id="result-screen" class="glass-panel w-full max-w-lg rounded-3xl p-8 md:p-10 hidden fade-in text-center">
        <div class="mb-4 flex justify-center">
            <div id="result-icon" class="p-5 rounded-full">
                <!-- Icon injected via JS -->
            </div>
        </div>
        <h2 class="text-3xl font-bold text-slate-800 mb-2">Sesi Tamat!</h2>
        <p class="text-slate-600 mb-6">Tahniah <span id="final-name" class="font-bold text-indigo-700"></span>, anda telah melengkapkan ulangkaji.</p>
        
        <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-200 shadow-inner">
            <p class="text-sm text-slate-500 font-semibold mb-1">Jumlah Markah Anda</p>
            <div class="text-5xl font-extrabold text-indigo-600 mb-2"><span id="score-display">0</span> <span class="text-2xl text-slate-400 font-medium">/ 30</span></div>
            <p id="percentage-display" class="text-lg font-medium text-slate-700"></p>
        </div>

        <p id="result-message" class="text-slate-700 font-medium mb-8 leading-relaxed"></p>
        
        <button id="restart-btn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-200">Ulangkaji Semula</button>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Database 30 Soalan
        const questions = [
            // Topik 1.1
            {
                q: "Apakah yang dimaksudkan dengan keupayaan peribumi (natively multimodal) yang dimiliki oleh Gemini AI?",
                options: [
                    "A) Memproses dan menjana teks bertulis sahaja tanpa sokongan perisian lain.",
                    "B) Memproses, mengaitkan, dan menganalisis pelbagai modaliti maklumat (teks, kod, grafik, audio, video) secara serentak.",
                    "C) Memerlukan modul tambahan luaran untuk membaca fail imej dan rajah teknikal.",
                    "D) Terhad kepada analisis dokumen PDF berteks tunggal sahaja."
                ],
                answer: 1,
                justification: "Gemini AI dibangunkan secara peribumi (natively multimodal) untuk mengendalikan pelbagai format maklumat secara terintegrasi dan serentak."
            },
            {
                q: "Apakah kelebihan utama ciri pemprosesan tetingkap konteks panjang (long-context window) Gemini AI dalam reka bentuk kurikulum?",
                options: [
                    "A) Menjana slaid persembahan secara automatik tanpa memerlukan arahan pensyarah.",
                    "B) Menganalisis dokumen akademik bersaiz besar seperti silibus, nota edaran, dan transkrip tanpa perlu memotong (chunking) maklumat.",
                    "C) Menggantikan keperluan pensyarah untuk menyemak dan merangka tugasan pelajar.",
                    "D) Mengurangkan penggunaan kuasa komputasi dan memori peranti semasa sesi kuliah."
                ],
                answer: 1,
                justification: "Tetingkap konteks panjang membolehkan dokumen bersaiz besar dimasukkan dalam satu sesi input tanpa kekangan pemotongan teks (chunking)."
            },
            {
                q: "Dalam aplikasi inklusiviti digital mengikut standard WCAG 2.1 Level AA, Gemini AI membantu pensyarah untuk:",
                options: [
                    "A) Menjana borang pengesahan kehadiran pelajar secara automatik di LMS.",
                    "B) Menyediakan teks alternatif (alt-text) pedagogi bagi rajah saintifik kompleks dan transkripsi ber-cap masa.",
                    "C) Menukar paparan warna komputer secara automatik mengikut zon waktu pengajaran.",
                    "D) Menggantikan fungsi pembaca skrin (screen reader) bagi pelajar kurang upaya penglihatan."
                ],
                answer: 1,
                justification: "Keupayaan multimodal Gemini AI membolehkan remedi bahan dengan menghasilkan alt-text berstruktur bagi imej teknikal serta transkrip audio/video."
            },
            {
                q: "Konsep peranan Gemini AI sebagai Instructional Co-Designer menegaskan bahawa:",
                options: [
                    "A) AI mengambil alih peranan utama pensyarah sebagai penggubal mutlak kurikulum.",
                    "B) AI bertindak sebagai alat sokongan komputasi mempercepat draf idea, manakala pensyarah memegang kuasa veto akademik.",
                    "C) AI menilai dan memberikan gred akhir tugasan pelajar secara bebas tanpa penyeliaan insani.",
                    "D) Pensyarah menyerahkan sepenuhnya penyusunan Hasil Pembelajaran Kursus (CLO) kepada AI."
                ],
                answer: 1,
                justification: "Sebagai Instructional Co-Designer, AI membantu mempercepat draf instruksional, namun pertimbangan pedagogi dan penentukuran standard kekal di bawah autoriti pensyarah."
            },
            {
                q: "Pendekatan Kawalan Kualiti Insani (Human-in-the-Loop - HITL) dalam integrasi AI merangkumi perkara berikut, KECUALI:",
                options: [
                    "A) Semakan kritikal oleh pensyarah untuk mengesan halusinasi maklumat atau kesilapan konseptual AI.",
                    "B) Pengawalan nilai sahsiah, pertimbangan etika, dan bimbingan emosi pelajar oleh pensyarah.",
                    "C) Penetapan arahan pedagogi dan semakan semula draf oleh pensyarah sebelum modul diterbitkan.",
                    "D) Pelepasan tanggungjawab penilaian kualiti dan standard akademik sepenuhnya kepada algoritma AI."
                ],
                answer: 3,
                justification: "Pendekatan HITL MENGHALANG pelepasan tanggungjawab. Ia mewajibkan pertimbangan insani pensyarah pada setiap tahap untuk elak kebergantungan buta kepada AI."
            },
            {
                q: "Alatan Google Workspace manakah yang dipadankan khusus dengan Gemini AI untuk fungsi penjanaan draf RPH, senario kes PBL, dan soalan pentaksiran autentik?",
                options: [
                    "A) Google Sheets",
                    "B) Google Docs",
                    "C) Google Slides",
                    "D) Google Drive"
                ],
                answer: 1,
                justification: "Google Docs digunakan sebagai platform pengekstrakan utama untuk draf dokumen pengajaran, RPH, dan soalan pentaksiran berformat lengkap."
            },
            {
                q: "Apakah hasil pentadbiran/pedagogi utama yang diperoleh daripada integrasi Gemini AI bersama Google Sheets?",
                options: [
                    "A) Draf dokumen pengajaran berformat lengkap.",
                    "B) Jadual matriks pemetaan CLO-Bloom, binaan rubrik analitis, dan borang log penyata AI.",
                    "C) Paparan slaid persembahan interaktif.",
                    "D) Depo penyimpanan dan penyelarasan fail PDF silibus."
                ],
                answer: 1,
                justification: "Google Sheets difungsikan untuk penyusunan jadual berstruktur seperti matriks CLO-Bloom, perincian rubrik penilaian analitis, serta borang log penyata AI."
            },

            // Topik 1.2
            {
                q: "Teori Penjajaran Binaan (Constructive Alignment) oleh John Biggs (2011) menggabungkan dua prinsip utama iaitu:",
                options: [
                    "A) Behaviorisme dan penilaian berasaskan norma (norm-referenced).",
                    "B) Psikologi konstruktivisme dan penjajaran objektif pengajaran dengan kaedah pentaksiran.",
                    "C) Kognitivisme dan pengajaran berasaskan kuliah sehala secara berturut.",
                    "D) Pembelajaran masteri dan penggredan keluk normal (bell curve)."
                ],
                answer: 1,
                justification: "Penjajaran Binaan menggabungkan pandangan konstruktivisme (pelajar membina pengetahuan aktif) dengan penjajaran sistematik antara objektif dan pentaksiran."
            },
            {
                q: "Apakah tiga komponen teras kurikulum yang MESTI dirancang secara selari dalam kerangka Penjajaran Binaan?",
                options: [
                    "A) Hasil Pembelajaran Kursus (CLO), Aktiviti Pengajaran & Pembelajaran (TLA), dan Tugasan Pentaksiran (AT).",
                    "B) Rancangan Pengajaran Semester (RPS), Jadual Waktu Kuliah, dan Jam Kredit.",
                    "C) Hasil Pembelajaran Program (PLO), Objektif Pendidikan Program (PEO), dan Visi Fakulti.",
                    "D) Jam Pembelajaran Pelajar (SLT), Bahan Bantuan Pengajaran (BBP), dan Yuran Kursus."
                ],
                answer: 0,
                justification: "Tiga tiang utama Penjajaran Binaan Biggs ialah pencapaian CLO, latihan kognitif menerusi TLA (Aktiviti), dan pengukuran saksama menerusi AT (Pentaksiran)."
            },
            {
                q: "Apakah kesan utama sekiranya berlaku ketidakselarian antara CLO (aras KBAT tinggi) dengan aktiviti dan pentaksiran yang berasaskan hafalan fakta?",
                options: [
                    "A) Pelajar secara automatik mengamalkan pendekatan pembelajaran mendalam (deep learning).",
                    "B) Pelajar cenderung mengamalkan pendekatan pembelajaran permukaan (surface learning) sekadar untuk lulus.",
                    "C) Pelajar dapat menguasai kemahiran menyelesaikan masalah berasaskan data amali.",
                    "D) Pentaksiran menjadi lebih rintang terhadap penipuan AI Generatif."
                ],
                answer: 1,
                justification: "Apabila pentaksiran tidak selari dengan CLO beraras tinggi, pelajar akan memilih strategi pembelajaran permukaan (surface learning) sekadar untuk melepasi ujian hafalan."
            },
            {
                q: "Kemahiran kognitif seperti mencerakin data, mendiagnosis punca masalah, membanding bezakan variabel, dan mengenali corak berada pada aras Taksonomi Bloom Terpinda:",
                options: [
                    "A) Aras C3 (Mengaplikasi)",
                    "B) Aras C4 (Menganalisis)",
                    "C) Aras C5 (Menilai)",
                    "D) Aras C6 (Mencipta)"
                ],
                answer: 1,
                justification: "Aras C4 (Menganalisis) melibatkan keupayaan mencerakin bahan kompleks, mendiagnosis punca, dan memahami struktur hubungan antara komponen."
            },
            {
                q: "Manakah antara berikut merupakan contoh aktiviti yang mencerminkan pemikiran aras C5 (Menilai)?",
                options: [
                    "A) Pelajar merangka pelan strategi pemasaran berintegrasi baharu bagi perniagaan PKS.",
                    "B) Pelajar mengkritik hujah dan memjustifikasi keputusan dasar pelan pemulihan krisis.",
                    "C) Pelajar mencerakin penyata kewangan dua syarikat untuk membandingkan ROI.",
                    "D) Pelajar mengingati dan menyatakan semula definisi dasar fiskal negara."
                ],
                answer: 1,
                justification: "Aras C5 (Menilai) berfokus pada keupayaan mengkritik hujah, memjustifikasi keputusan berasaskan kriteria piawai, dan menilai keabsahan hipotesis."
            },
            {
                q: "Aras Taksonomi Bloom C6 (Mencipta) difokuskan kepada keupayaan pelajar untuk:",
                options: [
                    "A) Menyusun elemen secara berasas untuk merangka pelan tindakan, pembinaan sistem, atau prototaip baharu.",
                    "B) Mengkritik andaian etika berasaskan kriteria piawai industri.",
                    "C) Mencerakin maklumat kompleks kepada bahagian-bahagian kecil.",
                    "D) Mengulang fakta asas yang diperolehi daripada bahan bacaan pra-kelas."
                ],
                answer: 0,
                justification: "Aras C6 (Mencipta) menuntut pelajar membina produk, pelan tindakan, atau penyelesaian holistik baharu bagi masalah terbuka (ill-structured problems)."
            },
            {
                q: "Peranan Gemini AI dalam mengelakkan Scope Creep semasa perancangan kurikulum adalah untuk:",
                options: [
                    "A) Menambah seberapa banyak aktiviti teknologi di luar skop CLO.",
                    "B) Mengesan dan mengelakkan aktiviti pengajaran yang terkeluar daripada had batas domain kognitif CLO yang ditetapkan.",
                    "C) Menukar semua CLO aras rendah kepada aras C6 secara automatik.",
                    "D) Memastikan pensyarah tidak lagi melaksanakan aktiviti perbincangan fizikal."
                ],
                answer: 1,
                justification: "Scope Creep berlaku apabila pengajaran teralih kepada aktiviti sampingan yang tidak menyokong CLO. Gemini AI membantu memadankan TLA agar sentiasa terikat pada skop kognitif CLO."
            },

            // Topik 1.3
            {
                q: "Mengapakah penggunaan prompt asas atau kabur (seperti 'Sediakan soalan untuk tajuk Pemasaran') perlu dielakkan oleh pensyarah IPT?",
                options: [
                    "A) Kerana ia memerlukan penggunaan kuasa komputasi yang terlalu tinggi.",
                    "B) Kerana ia menghasilkan output yang umum (generic), superfisial, dan terdedah kepada halusinasi maklumat.",
                    "C) Kerana model Gemini AI akan menolak arahan tersebut secara automatik.",
                    "D) Kerana output yang dihasilkan terlalu rumit untuk dibaca oleh pensyarah."
                ],
                answer: 1,
                justification: "Arahan yang ringkas dan tanpa konteks spesifik menyebabkan AI menjana maklum balas asas yang umum, superfisial dan terdedah kepada kesilapan (halusinasi)."
            },
            {
                q: "Apakah elemen [P] dalam Kerangka Prompt Pedagogi PCTC (Mollick & Mollick, 2023)?",
                options: [
                    "A) Process (Alur kerja arahan)",
                    "B) Persona (Identiti dan peranan kepakaran AI)",
                    "C) Performance (Pencapaian pelajar)",
                    "D) Product (Hasil modul akhir)"
                ],
                answer: 1,
                justification: "Elemen [P] mewakili Persona iaitu penetapan identiti dan tahap kepakaran yang perlu dianak-angkat oleh AI (contoh: Pakar Kurikulum IPT)."
            },
            {
                q: "Komponen Context [C] dalam kerangka PCTC berfungsi membekalkan maklumat mengenai:",
                options: [
                    "A) Format persembahan output dan kekangan patah perkataan.",
                    "B) Latar belakang kursus, profil pelajar, pengetahuan sedia ada, dan aras Taksonomi Bloom sasaran.",
                    "C) Peranan kepakaran luar yang perlu ditiru oleh AI.",
                    "D) Kata kerja arahan tugasan spesifik yang perlu dihasilkan."
                ],
                answer: 1,
                justification: "Context membekalkan latar belakang persekitaran pengajaran (tahap pelajar, topik, CLO) supaya output AI disesuaikan dengan aras kognitif yang tepat."
            },
            {
                q: "Pernyataan arahan: 'Bina satu senario krisis kajian kes terbuka berasaskan gangguan logistik pelabuhan bagi aktiviti PBL' mewakili komponen PCTC yang manakah?",
                options: [
                    "A) Persona [P]",
                    "B) Context [C]",
                    "C) Task [T]",
                    "D) Constraint [C]"
                ],
                answer: 2,
                justification: "Task [T] ialah kata kerja arahan spesifik tentang apakah artifak atau aktiviti pedagogi yang perlu dihasilkan oleh AI."
            },
            {
                q: "Komponen Constraint [C] dalam kerangka PCTC merangkumi perkara berikut, KECUALI:",
                options: [
                    "A) Format persembahan output (cth: jadual Markdown).",
                    "B) Had masa pelaksanaan atau kekangan patah perkataan.",
                    "C) Penetapan identiti dan kepakaran profesional AI.",
                    "D) Syarat sempadan etika dan larangan memberikan jawapan terus."
                ],
                answer: 2,
                justification: "Penetapan identiti dan kepakaran AI ialah fungsi bagi komponen Persona [P], bukannya Constraint [C]."
            },
            {
                q: "Manakah antara berikut merupakan perbandingan yang BETUL antara Prompt Asas dengan Prompt Kerangka PCTC?",
                options: [
                    "A) Prompt Asas menghasilkan soalan KBAT (C5-C6), manakala PCTC menghasilkan soalan C1-C2.",
                    "B) Prompt PCTC menghasilkan output berstruktur (jadual/templat) yang jitu, manakala Prompt Asas menghasilkan teks panjang tidak berstruktur.",
                    "C) Prompt Asas lebih disukai kerana tidak memerlukan penetapan konteks pengajaran.",
                    "D) Prompt PCTC menyebabkan output AI kerap terkeluar daripada skop (scope creep)."
                ],
                answer: 1,
                justification: "Prompt PCTC dijamin menghasilkan output yang sedia diguna pakai, berstruktur (jadual Markdown/slaid outline), serta mematuhi aras KBAT yang disasarkan berbanding teks tidak berstruktur."
            },
            {
                q: "Bagaimanakah Kerangka PCTC membantu penyediaan pentaksiran rintang-AI menerusi elemen Constraint?",
                options: [
                    "A) Memaksa AI menjana soalan pilihan ganda berasaskan hafalan fakta terus.",
                    "B) Mengarahkan AI memasukkan elemen hiper-lokal, Borang Log Penyata AI, dan soalan pertahanan lisan (Viva Voce).",
                    "C) Mengharamkan penggunaan sebarang alatan teknologi oleh pensyarah.",
                    "D) Mengurangkan tahap kognitif soalan pentaksiran kepada C1 sahaja."
                ],
                answer: 1,
                justification: "Menerusi kekangan (Constraint), pensyarah mengarahkan AI merangka soalan berasaskan data tempatan, memasukkan log transparensi AI, dan menyediakan soalan viva lisan."
            },
            {
                q: "Borang Log Penyata Penggunaan AI (AI Disclosure Log) menghendaki pelajar melampirkan maklumat berikut, KECUALI:",
                options: [
                    "A) Nama alat AI dan model yang digunakan.",
                    "B) Teks prompt utama yang dikemukakan.",
                    "C) Analisis kritikal dan pembetulan kendiri pelajar terhadap output AI.",
                    "D) Markah gred akhir yang diharapkan oleh pelajar daripada pensyarah."
                ],
                answer: 3,
                justification: "Log Penyata AI bertujuan menilai integriti proses pelajar dalam memproses hasil AI (alat, prompt, pembetulan), bukannya markah sasaran peribadi pelajar."
            },

            // Topik 1.4
            {
                q: "Apakah urutan fasa yang BETUL bagi pelaksanaan strategi Think-Pair-Share (TPS) di dalam kelas?",
                options: [
                    "A) Share (5 Min) -> Pair (3 Min) -> Think (1-2 Min)",
                    "B) Think (1-2 Min) -> Pair (3 Min) -> Share (5 Min)",
                    "C) Pair (3 Min) -> Think (1-2 Min) -> Share (5 Min)",
                    "D) Think (5 Min) -> Share (3 Min) -> Pair (1-2 Min)"
                ],
                answer: 1,
                justification: "Urutan TPS bermula dengan pemikiran individu (Think: 1-2m), perbincangan berpasangan (Pair: 3m), dan diakhiri pembentangan dapatan (Share: 5m)."
            },
            {
                q: "Semasa fasa Think (1–2 Minit) dalam TPS, pelajar dikehendaki:",
                options: [
                    "A) Berbincang secara agresif dengan rakan di sebelah.",
                    "B) Menggunakan peranti digital untuk menyemak enjin carian Google.",
                    "C) Berfikir dan mencatat poin utama secara individu tanpa berbincang atau menyemak peranti digital.",
                    "D) Membentangkan jawapan terus kepada pensyarah di hadapan kelas."
                ],
                answer: 2,
                justification: "Fasa Think mewajibkan pemprosesan kognitif individu tanpa gangguan perbincangan atau peranti digital bagi membina keyakinan menyuarakan idea."
            },
            {
                q: "Ciri utama senario masalah terbuka (ill-structured problem) dalam Pembelajaran Berasaskan Masalah (PBL) ialah:",
                options: [
                    "A) Mengandungi maklumat lengkap dan jawapan tepat yang tunggal.",
                    "B) Berasaskan krisis dunia sebenar, sempadan maklumat kabur/tidak lengkap, dan tiada penyelesaian tunggal.",
                    "C) Hanya berasaskan teori buku teks tanpa sebarang aplikasi praktikal.",
                    "D) Boleh diselesaikan terus menggunakan perisian enjin carian dalam masa 1 minit."
                ],
                answer: 1,
                justification: "Masalah terbuka (ill-structured) sengaja meninggalkan maklumat tertentu tidak lengkap dan mengandungi dilema untuk memacu pelajar membuat kajian kendiri."
            },
            {
                q: "Tiga komponen utama dalam Papan KWL yang digunakan semasa fasilitasi PBL ialah:",
                options: [
                    "A) Knowledge, Wisdom, Learning.",
                    "B) What we Know, What we Want to know, What we Learned.",
                    "C) Key Concepts, Work plan, Logic.",
                    "D) Known facts, Weaknesses, Limitations."
                ],
                answer: 1,
                justification: "Papan KWL memandu pelajar mencerakin fakta sedia ada (Know), mengenalpasti maklumat yang terlepas/perlu dicari (Want to know), dan menyintesis hasil kajian kendiri (Learned)."
            },
            {
                q: "Bagaimanakah struktur pengajaran tradisional dibalikkan dalam model Flipped Classroom?",
                options: [
                    "A) Pemindahan maklumat asas (C1-C2) dilakukan di luar kelas, manakala pemprosesan kognitif tinggi (C4-C6) dilaksanakan di dalam kelas.",
                    "B) Semua aktiviti pengajaran dan pentaksiran dipindahkan 100% secara dalam talian tanpa sesi bersemuka.",
                    "C) Pensyarah memberi kuliah sehala 2 jam di dalam kelas dan pelajar membuat ujian di rumah.",
                    "D) Pelajar bertindak sebagai pengajar di dalam bilik darjah fizikal secara bergilir-gilir."
                ],
                answer: 0,
                justification: "Flipped Classroom memindahkan teori asas (C1-C2) ke waktu pra-kelas (video/kuiz), supaya masa kelas fizikal khusus untuk aktiviti interaktif dan penyelesaian masalah (C4-C6)."
            },
            {
                q: "Berdasarkan kajian Guo et al. (2014), berapakah durasi ideal bagi mikro-kuliah video pra-kelas sebelum tumpuan (attention span) pelajar merosot?",
                options: [
                    "A) 15 hingga 20 minit",
                    "B) 5 hingga 7 minit",
                    "C) 30 minit penuh",
                    "D) 1 hingga 2 minit sahaja"
                ],
                answer: 1,
                justification: "Kajian membuktikan tumpuan pelajar terhadap video pengajaran merosot secara drastik selepas 6 minit, justeru 5-7 minit adalah yang paling optimum."
            },
            {
                q: "Apakah tujuan utama pelaksanaan Ujian Semakan Akses (Entry Quiz) di LMS sebelum sesi kelas Flipped Classroom bermula?",
                options: [
                    "A) Menguji hafalan istilah perkataan-demi-perkataan untuk gred ganjaran.",
                    "B) Memverifikasi penyelesaian bahan pra-kelas dan menyokong Pengajaran Tepat Pada Masa (Just-In-Time Teaching).",
                    "C) Menggantikan Pentaksiran Akhir Semester secara rasmi.",
                    "D) Mengurangkan masa pelajar berada di dalam kawasan kampus."
                ],
                answer: 1,
                justification: "Entry Quiz memastikan pelajar bersedia dengan bahan tontonan serta membolehkan pensyarah mengenal pasti salah faham konsep awal (JiTT) untuk dibincangkan di dalam kelas."
            },
            {
                q: "Manakah pemadanan yang BETUL antara strategi pembelajaran aktif dengan peranan utama Gemini AI?",
                options: [
                    "A) TPS -> Menyusun skrip video mikro 6 minit dan Entry Quiz LMS.",
                    "B) PBL -> Menjana senario krisis terbuka, data palsu realistik, dan soalan pemicu KWL.",
                    "C) Flipped Classroom -> Menjana soalan provokatif pantas 1-minit di dalam kelas.",
                    "D) Kuliah Sehala -> Menggantikan peranan fasilitasi pensyarah secara automatik."
                ],
                answer: 1,
                justification: "Dalam pelaksanaan PBL, kemampuan AI paling optimum digunakan untuk merangka senario kes krisis terbuka (ill-structured), data realistik, dan menjana soalan pemicu KWL."
            }
        ];

        // State Variables
        let currentQuestionIndex = 0;
        let score = 0;
        let studentName = "";
        let optionSelected = false;

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const nameInput = document.getElementById('student-name');
        const startBtn = document.getElementById('start-btn');
        const nameError = document.getElementById('name-error');
        
        const displayName = document.getElementById('display-name');
        const currentQNum = document.getElementById('current-q-num');
        const progressBar = document.getElementById('progress-bar');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackJustification = document.getElementById('feedback-justification');
        
        const nextBtn = document.getElementById('next-btn');
        const finishBtn = document.getElementById('finish-btn');
        
        const finalName = document.getElementById('final-name');
        const scoreDisplay = document.getElementById('score-display');
        const percentageDisplay = document.getElementById('percentage-display');
        const resultMessage = document.getElementById('result-message');
        const resultIcon = document.getElementById('result-icon');
        const restartBtn = document.getElementById('restart-btn');

        // SVG Icons
        const iconCorrect = `<svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        const iconWrong = `<svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
        const iconTrophy = `<svg class="w-16 h-16 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 01.031 1.74l-3.321 1.956-.99 4.316a1 1 0 01-1.895.076L9.67 13.5l-3.418-1.782a1 1 0 01-.065-1.767l3.29-1.996L10.3 2.723A1 1 0 0112 2z" clip-rule="evenodd"></path></svg>`;
        const iconStar = `<svg class="w-16 h-16 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>`;

        // Event Listeners
        startBtn.addEventListener('click', startQuiz);
        nextBtn.addEventListener('click', nextQuestion);
        finishBtn.addEventListener('click', showResults);
        restartBtn.addEventListener('click', restartQuiz);
        
        nameInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') startQuiz();
        });

        // Functions
        function startQuiz() {
            const name = nameInput.value.trim();
            if (name === "") {
                nameError.classList.remove('hidden');
                return;
            }
            nameError.classList.add('hidden');
            studentName = name;
            displayName.textContent = studentName;
            
            // Reset state
            currentQuestionIndex = 0;
            score = 0;
            
            // Switch screens
            loginScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            
            loadQuestion();
        }

        function loadQuestion() {
            optionSelected = false;
            feedbackContainer.classList.add('hidden');
            nextBtn.classList.add('hidden');
            finishBtn.classList.add('hidden');
            
            const q = questions[currentQuestionIndex];
            
            // Update Progress
            currentQNum.textContent = currentQuestionIndex + 1;
            const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            // Render Question
            questionText.textContent = `${currentQuestionIndex + 1}. ${q.q}`;
            
            // Render Options
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700 font-medium";
                btn.textContent = opt;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (optionSelected) return; // Prevent multiple clicks
            optionSelected = true;
            
            const q = questions[currentQuestionIndex];
            const isCorrect = (selectedIndex === q.answer);
            
            // Disable all buttons
            const allBtns = optionsContainer.querySelectorAll('button');
            allBtns.forEach((btn, i) => {
                btn.disabled = true;
                btn.classList.remove('hover:bg-indigo-50', 'hover:border-indigo-300');
                
                if (i === q.answer) {
                    // Highlight correct answer
                    btn.classList.replace('border-slate-200', 'border-green-500');
                    btn.classList.replace('bg-slate-50', 'bg-green-100');
                    btn.classList.add('text-green-800', 'font-bold');
                } else if (i === selectedIndex && !isCorrect) {
                    // Highlight wrong answer selected
                    btn.classList.replace('border-slate-200', 'border-red-500');
                    btn.classList.replace('bg-slate-50', 'bg-red-100');
                    btn.classList.add('text-red-800');
                } else {
                    // Dim others
                    btn.classList.add('opacity-50');
                }
            });

            if (isCorrect) {
                score++;
                feedbackIcon.innerHTML = iconCorrect;
                feedbackTitle.textContent = "Tepat Sekali!";
                feedbackTitle.className = "font-bold text-lg mb-1 text-green-700";
                feedbackContainer.className = "rounded-xl p-5 mb-6 border bg-green-50 border-green-200 fade-in block";
            } else {
                feedbackIcon.innerHTML = iconWrong;
                feedbackTitle.textContent = "Kurang Tepat";
                feedbackTitle.className = "font-bold text-lg mb-1 text-red-700";
                feedbackContainer.className = "rounded-xl p-5 mb-6 border bg-red-50 border-red-200 fade-in block";
            }

            feedbackJustification.textContent = q.justification;

            // Show Next or Finish button
            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.classList.remove('hidden');
            } else {
                progressBar.style.width = '100%';
                finishBtn.classList.remove('hidden');
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            
            finalName.textContent = studentName;
            scoreDisplay.textContent = score;
            
            const percentage = Math.round((score / questions.length) * 100);
            percentageDisplay.textContent = `${percentage}% Penguasaan Modul`;

            if (percentage >= 80) {
                resultIcon.innerHTML = iconTrophy;
                resultIcon.className = "p-5 rounded-full bg-yellow-100";
                resultMessage.textContent = "Cemerlang! Anda telah menguasai konsep integrasi AI dalam Pedagogi dan Penjajaran Binaan dengan sangat baik. Anda bersedia untuk mengaplikasikannya di bilik darjah.";
            } else if (percentage >= 50) {
                resultIcon.innerHTML = iconStar;
                resultIcon.className = "p-5 rounded-full bg-blue-100";
                resultMessage.textContent = "Tahniah! Pencapaian yang baik. Anda memahami konsep asas, namun sedikit ulangkaji pada bahagian kerangka PCTC dan Flipped Classroom akan menjadikan anda lebih mahir.";
            } else {
                resultIcon.innerHTML = iconWrong; // Reuse wrong icon for low score, or just styling
                resultIcon.className = "p-5 rounded-full bg-red-100";
                resultMessage.textContent = "Jangan putus asa. Sila baca semula modul nota dan beri tumpuan pada kefahaman asas Penjajaran Binaan (Biggs) dan cara Gemini bertindak sebagai Instructional Co-Designer.";
            }
        }

        function restartQuiz() {
            resultScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            nameInput.value = '';
            nameInput.focus();
        }
    </script>
</body>
</html>
